[metadata]
name = swtich-over-deployment
summary = Hardware manager to deploy without restarting the ironic node
license = Apache-2
classifier =
    License :: OSI Approved :: Apache Software License
    Programming Language :: Python :: 3

[files]
modules =
    switch_over_deployment

[entry_points]
ironic_python_agent.hardware_managers =
    switch_over_deployment = switch_over_deployment:SwitchOverDeploymentHardwareManager
